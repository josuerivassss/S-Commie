[package]
name = "scommie"
version = "3.0.0"
edition = "2021"
description = "S Commie - Image manipulation & JSON API, written in Rust + Axum"

# release profile tuned for low RAM/CPU footprint on small hosts (Pterodactyl, etc.)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = { version = "0.7", features = ["query"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tower = { version = "0.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif"] }
imageproc = "0.23"
rusttype = "0.9"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
once_cell = "1"
anyhow = "1"
ocrs = "0.12.2"
rten = "0.24"
emojis = "0.9.0"
dashmap = "6.2.1"